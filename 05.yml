apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      sanath: achar
  template:
    metadata:
      labels:
        sanath: achar
    spec:
      containers:
        - name: nginx-cont
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1 
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    sanath: achar
  ports:
    - port: 80
      targetPort: 80