apiVersion: v1
kind: Pod
metadata: 
  name: swiggy-pod
  labels: 
    sanath: achar
spec:
  containers:
    - name: swiggy-cont
      image: kastrov/swiggy
      ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata: 
  name: swiggy-service
spec:
  type: LoadBalancer
  selector:
    sanath: achar
  ports:
    - port: 80
      targetPort: 3000 