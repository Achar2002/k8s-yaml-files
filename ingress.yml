#app1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      sanath: achari
  template:
     metadata:
      labels:
        sanath: achari
    spec:
      containers:
        - name: nginx-cont
          image: nginx
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "NGINX APP 1"
---
apiVersion: v1 
kind: Service
metadata:
  name: nginx-service
spec:
  type: ClusterIP
  ports:
    - port: 80
  selector:
    sanath: achari
#app2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      sanath: achar
  template:
     metadata:
      labels:
        sanath: achar
    spec:
      containers:
        - name: httpd-cont
          image: httpd
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "HTTPD APP 1"
---
apiVersion: v1 
kind: Service
metadata:
  name: httpd-service
spec:
  type: ClusterIP
  ports:
    - port: 80
  selector:
    sanath: achar
  
  # ingress config
  apiVersion: networking.k8s.io.v1
  kind: ingress
  metadata: 
    name: k8s-ingress
    annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec: 