#Pod Manifest File
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels: #this label will be used in service manifest file to identify the pod
    app: nginx-app
spec:
  containers:
    - name: nginx-container
      image: nginx:stable-alpine
      ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata: 
  name: my-nginx-service
spec:
  type: ClusterIP #to access the app within the cluster
  selector: 
    app: nginx-app  #must match with pod label
  ports:
    - protocol: TCP
      port: 80  #Service Port - not mandatory
      targetPort: 80 #pod's container port - mandatory

      # Pod Manifest File
apiVersion: v1
kind: Pod
metadata:
  name: zomato-pod
  labels:
    app: zomato
spec:
  containers:
    - name: zomato-container
      image: kastrov/zomato
      ports:
        - containerPort: 3000
---
# Service Manifest File
apiVersion: v1
kind: Service
metadata:
  name: zomato-service
spec:
  type: NodePort
  selector: 
    app: zomato
  ports:
    - port: 80 #Service Port (Internal Access in Cluster)
      targetPort: 3000 #Container Port
      nodePort: 32000 #range is 30000-32767

      #Pod Manifest
apiVersion: v1
kind: Pod
metadata:
  name: swiggy-pod
  labels:
    app: swiggy
spec:
  containers:
    - name: swiggy-container
      image: kastrov/swiggy
      ports:
        - containerPort: 3000
---
#Service Manifest
apiVersion: v1
kind: Service
metadata:
  name: swiggy-service
spec:
  type: LoadBalancer
  selector:
    app: swiggy
  ports:
    - port: 80
      targetPort: 3000 #container port
      
# Nginx + Sidecar Pod + NodePort Service YAML
apiVersion: v1
kind: Pod
metadata:
  name: nginx-sidecar
  labels:
    app: nginx-sidecar
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx

    - name: log-tailer
      image: busybox
      command: ["sh", "-c"]
      args: ["tail -f /var/log/nginx/access.log"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx

  volumes:
    - name: shared-logs
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-sidecar-service
spec:
  type: NodePort
  selector:
    app: nginx-sidecar
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080   # You can change this if needed (range 30000–32767)
