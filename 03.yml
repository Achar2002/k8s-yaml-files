apiVersion: v1
kind: Pod
metadata:
  name: zomato-pod
  labels:
    sanath: achar
spec:
  containers:
    - name: zomato-cont
      image: kastrov/zomato
      ports:
        containerPort: 3000
---
apiVersion: v1
kind: Service
metadata: 
  name: zomato-service
spec: 
  type: NodePort
  selector:
    sanath: achar
  ports:
    targetPort: 3000
    